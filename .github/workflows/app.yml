name: app

# The Flutter client: analyzer with fatal infos, tests, and the web build the
# desktop wrapper serves. Three parallel jobs rather than one serial one: in
# series they took 112 s on a warm cache, past the one-minute budget.
# Tests run as slices (6) to keep each job under 60 s (the action cap).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [analyze, test-1, test-2, test-3, test-4, test-5, test-6, web]
    name: flutter (${{ matrix.task }})
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: kuhyx/utils/flutter-setup@flutter-setup-v1
        with:
          flutter-version: 3.50.1
          working-directory: app
      - run: flutter pub get
      - if: matrix.task == 'analyze'
        run: |
          dart format --output=none --set-exit-if-changed lib test bin
      - if: matrix.task == 'web'
        run: flutter build web --release
      - if: matrix.task != 'analyze' && matrix.task != 'web'
        run: |
          SLICE="${{ matrix.task }}"
          SLICE_NUM="${SLICE#test-}"
          ../scripts/app_test_all.sh "${SLICE_NUM}/6"
