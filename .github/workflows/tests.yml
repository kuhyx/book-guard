name: tests

# The Python suite (100% branch coverage is enforced by pyproject's addopts)
# and the full pre-commit gate, from the same dev venv setup_dev.sh builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the shared gates
        uses: actions/checkout@v4
        with:
          repository: kuhyx/utils
          path: .utils
      - name: Point the delegates at that checkout
        run: echo "UTILS_ROOT=$GITHUB_WORKSPACE/.utils" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Ensure tkinter and shellcheck
        run: |
          python -c 'import tkinter' || { sudo apt-get update; sudo apt-get install -y python3-tk; }
          command -v shellcheck || sudo apt-get install -y shellcheck
      - name: Dev venv
        run: bash scripts/setup_dev.sh
      - name: Tests
        run: .venv/bin/python -m pytest -p no:cacheprovider -q
      - name: pre-commit (Python hooks)
        run: |
          .venv/bin/python -m pip install --quiet pre-commit
          SKIP=app-analyze,app-test,dependency-freshness .venv/bin/pre-commit run --all-files
