[project]
name = "book-guard"
version = "1.0.0"
description = "Tkinter/systemd gate that locks the PC until a month's paper-book reading is on pace"
requires-python = ">=3.14"
# gatelock: shared lock-window/arbiter/HMAC backend (all five lockers).
# freedays: the shared free-day pool every gate consults.
# pillow: EXIF capture time + downscaling before the vision call.
# fastembed: multilingual embeddings that anchor photos in the ebook file.
dependencies = [
    "gatelock @ git+https://github.com/kuhyx/utils@gatelock-v0.9.0#subdirectory=gatelock",
    "freedays @ git+https://github.com/kuhyx/utils@freedays-v0.3.0#subdirectory=freedays",
    "fastembed==0.8.1",
    "pillow==12.3.0",
]

[project.scripts]
book-guard = "book_guard._cli:main"

# Only the read-only MCP server (book_guard._mcp) needs this; it runs from its
# own venv (scripts/setup_mcp.sh), never the systemd path.
[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
# The test + lint toolchain the pre-commit gate runs from .venv.
dev = ["mypy==2.4.0", "pylint==4.1.2", "pytest==9.1.1", "pytest-cov==7.1.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["book_guard*"]

[tool.ruff]
target-version = "py314"
include = ["*.py", "**/*.py"]
exclude = [".git", ".venv", "__pycache__", "build", "dist", ".demo", "app"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "S603"]

# The same test-only relaxations every sibling guard repo uses (copied from
# leetcode-guard): asserts, fixtures without annotations, private access.
[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "ANN", "ARG", "D", "DTZ011", "E501", "FBT",
    "PLC0415", "PLR0913", "PLR2004", "PTH", "RUF003", "S101", "S104", "S105",
    "SLF001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["book_guard"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true
exclude = [".venv/", ".demo/", "app/"]

[tool.pylint.main]
py-version = "3.14"
jobs = 0
ignore = [".venv", "__pycache__", ".demo", "app"]
ignore-paths = ["^(.*/)?tests/.*$"]

[tool.pylint.messages_control]
enable = "all"
disable = [
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
]

[tool.pylint.design]
min-public-methods = 0
max-attributes = 10

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".demo", "app"]

[tool.pytest.ini_options]
testpaths = ["book_guard/tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=book_guard",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
# An unclosed sqlite connection or file is a descriptor leak in the
# long-running inbox worker (found 2026-09-26): fail the suite on it.
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
omit = ["book_guard/tests/*"]
