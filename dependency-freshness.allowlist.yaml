# book-guard's own additions to the fleet-wide allowlist
# (~/src/utils/dependency-freshness.allowlist.yaml).

exceptions:
  - ecosystem: pypi
    package: pillow
    pinned: "12.3.0"
    latest_known: "13.0.0"
    reason: >-
      fastembed 0.9.0 -- itself the latest release -- declares
      `pillow<13.0,>=12.0.0`, and book-guard pins both. The suite passes on
      pillow 13 (checked 2026-10-17), so this lifts the day fastembed allows it.
    blocked_by: "transitive:fastembed@0.9.0"
  - ecosystem: toolchain
    package: python
    pinned: "3.14"
    latest_known: "3.15.2"
    reason: >-
      fastembed needs onnxruntime, and onnxruntime 1.31.1 -- itself the
      latest release -- ships no cp315 wheel (newest: cp314), so CI's
      `setup_dev.sh` fails on Python 3.15. tests.yml pins 3.14 until a 3.15
      wheel ships (unpin tracked in todo-app task 0ea3306e, 2026-11-02).
    blocked_by: "transitive:onnxruntime@1.31.1"
