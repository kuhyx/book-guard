# book-guard's commit gate. Python: the same hooks as the sibling guards
# (leetcode-guard), at their newest releases. The Flutter app under app/ is
# gated by `flutter analyze` + its tests (the app-* hooks below).
default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false
exclude: ^(\.demo/|app/build/|app/\.dart_tool/)
default_install_hook_types: [pre-commit, post-commit, post-merge, post-rewrite]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^book_guard/tests/(_[a-z][a-z_]*|conftest)\.py$
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]
      - id: no-dart-ignore
        name: Block dart analyzer ignore comments
        entry: '//\s*ignore(_for_file)?:'
        language: pygrep
        files: ^app/.*\.dart$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      # The dev venv (scripts/setup_dev.sh) has every runtime dependency, so
      # mypy runs strict with no disabled error codes.
      - id: mypy
        name: mypy (strict, dev venv)
        entry: .venv/bin/python -m mypy book_guard scripts
        language: system
        pass_filenames: false
        types: [python]
      # Changed files only: the whole tree took ~16 s of a commit's 60 s cap
      # (jobs=1, see pyproject); --all-files / CI still lint everything.
      - id: pylint
        name: pylint (dev venv)
        entry: .venv/bin/python -m pylint --rcfile=pyproject.toml --fail-under=10
        language: system
        files: ^(book_guard|scripts)/.*\.py$
        types: [python]
      - id: pytest
        name: pytest (100% branch coverage)
        entry: .venv/bin/python -m pytest -p no:cacheprovider -q
        language: system
        pass_filenames: false
        types: [python]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, --severity-level=high, --confidence-level=medium]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(book_guard/tests/|scripts/)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --skip=*.json,*.lock,.git,__pycache__,.venv,.demo,app/build
          - --ignore-words-list=nd,te,als,ans
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: bash -c 'printf "%s\0" "$@" | xargs -0 -n 40 shellcheck --severity=warning' --
        language: system
        types: [shell]
      - id: file-length
        name: file length <= 250 lines
        entry: scripts/check_file_length.sh
        language: system
      - id: no-silent-failures
        name: Block silent failures (swallowed exceptions must log why)
        entry: python3 scripts/check_silent_failures.py
        language: system
        types: [python]
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      - id: todo-closer
        name: close Todo trailer tasks
        entry: scripts/todo_hooks.sh closer
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-merge
        name: import PR Todo sections (pull)
        entry: scripts/todo_hooks.sh import-pr post-merge
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-rewrite
        name: import PR Todo sections (pull --rebase)
        entry: scripts/todo_hooks.sh import-pr post-rewrite
        language: system
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pubspec\.(yaml|lock)|pyproject\.toml|requirements.*\.txt
          |\.fvmrc|\.github/workflows/.*\.ya?ml)$
      - id: app-analyze
        name: flutter analyze (app)
        entry: bash -c 'cd app && $(command -v fvm >/dev/null && echo fvm) flutter analyze --fatal-infos'
        language: system
        pass_filenames: false
        files: ^app/(lib|test|bin)/.*\.dart$
      - id: app-format
        name: dart format (app, as CI checks it)
        entry: bash -c 'cd app && $(command -v fvm >/dev/null && echo fvm) dart format --output=none --set-exit-if-changed lib test bin'
        language: system
        pass_filenames: false
        files: ^app/(lib|test|bin)/.*\.dart$
      - id: app-test
        name: flutter test (app)
        # Only the tests the commit touches (changed tests + direct importers
        # of changed lib files): the whole suite runs past the 60 s action
        # cap. CI (app.yml) runs it all. The script runs -j 1: the whole
        # pre-commit run sits in one 2 GiB capped.sh scope with no swap
        # (anon peak 2026-11-17: -j 2 1680 MiB, -j 1 1073 MiB). Pinned by
        # test_repo_hooks.py.
        entry: scripts/app_test_changed.sh
        language: system
        pass_filenames: true
        require_serial: true  # one flutter run, not one per file batch
        files: ^app/((lib|test|bin)/.*\.dart|pubspec\.(yaml|lock)|analysis_options\.yaml)$
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$|(^|/)(AndroidManifest\.xml|build\.gradle(\.kts)?|strings\.xml|pubspec\.yaml|repo-contract\.toml|[^/]+\.desktop|assets/icon/[^/]+\.png)$
