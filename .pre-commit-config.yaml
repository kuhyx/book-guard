# book-guard's commit gate. Python: the same hooks as the sibling guards
# (leetcode-guard), at their newest releases. The Flutter app under app/ is
# gated by `flutter analyze` + its tests (the app-* hooks below).
default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false
exclude: ^(\.demo/|app/build/|app/\.dart_tool/)
default_install_hook_types: [pre-commit, post-commit, post-merge, post-rewrite]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # flutter_launcher_icons writes these two without a final newline; keep
      # its bytes so a regen leaves the checkout clean (todo fe70b845).
      - id: end-of-file-fixer
        exclude: ^app/(android/app/src/main/res/values/colors\.xml|web/manifest\.json)$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]
      - id: no-dart-ignore
        name: Block dart analyzer ignore comments
        entry: '//\s*ignore(_for_file)?:'
        language: pygrep
        files: ^app/.*\.dart$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: pytest
        name: pytest (100% branch coverage)
        entry: |
          bash -c 'if .venv/bin/python -c "import xdist" 2>/dev/null; then exec .venv/bin/python -m pytest -p no:cacheprovider -q -n 2; else echo "pytest-xdist missing (run scripts/setup_dev.sh): serial run" >&2; exec .venv/bin/python -m pytest -p no:cacheprovider -q; fi'
        language: system
        pass_filenames: false
        types: [python]
  - repo: local
    hooks:
      - id: no-silent-failures
        name: Block silent failures (swallowed exceptions must log why)
        entry: python3 scripts/check_silent_failures.py
        language: system
        types: [python]
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      - id: todo-closer
        name: close Todo trailer tasks
        entry: scripts/todo_hooks.sh closer
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-merge
        name: import PR Todo sections (pull)
        entry: scripts/todo_hooks.sh import-pr post-merge
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-rewrite
        name: import PR Todo sections (pull --rebase)
        entry: scripts/todo_hooks.sh import-pr post-rewrite
        language: system
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pubspec\.(yaml|lock)|pyproject\.toml|requirements.*\.txt
          |\.fvmrc|\.github/workflows/.*\.ya?ml)$
      - id: app-format
        name: dart format (app, as CI checks it)
        entry: bash -c 'cd app && $(command -v fvm >/dev/null && echo fvm) dart format --output=none --set-exit-if-changed lib test bin'
        language: system
        pass_filenames: false
        files: ^app/(lib|test|bin)/.*\.dart$
      - id: app-test
        name: flutter test (app)
        # At most 6 test files (scripts/app_test_changed.sh GATE_MAX): changed
        # tests first, then direct importers of changed lib files; a pubspec
        # or --all-files run takes an even spread of 6. CI (app.yml) runs the
        # whole suite. The script runs -j 1: the whole
        # pre-commit run sits in one 2 GiB capped.sh scope with no swap
        # (anon peak 2026-11-17: -j 2 1680 MiB, -j 1 1073 MiB). Pinned by
        # test_repo_hooks.py.
        entry: scripts/app_test_changed.sh
        language: system
        pass_filenames: true
        require_serial: true  # one flutter run, not one per file batch
        files: ^app/((lib|test|bin)/.*\.dart|pubspec\.(yaml|lock)|analysis_options\.yaml)$
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$|(^|/)(AndroidManifest\.xml|build\.gradle(\.kts)?|strings\.xml|pubspec\.yaml|repo-contract\.toml|[^/]+\.desktop|assets/icon/[^/]+\.png)$
